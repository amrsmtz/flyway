# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  # Each run drains the feed's queue for under a minute; the eBird handlers
  # pause the feed themselves when the hourly quota is nearly used.
  run_ebird_ingestion:
    class: Ingestion::RunFeedJob
    args: [ ebird ]
    schedule: every minute
  plan_ebird_live_units:
    class: Ebird::PlanLiveJob
    schedule: every hour at minute 2
  run_inaturalist_ingestion:
    class: Ingestion::RunFeedJob
    args: [ inaturalist ]
    schedule: every minute
  plan_inaturalist_live_units:
    class: Inaturalist::PlanLiveJob
    schedule: every 15 minutes
  run_open_meteo_ingestion:
    class: Ingestion::RunFeedJob
    args: [ open_meteo ]
    schedule: every minute
  plan_open_meteo_live_units:
    class: OpenMeteo::PlanLiveJob
    schedule: every hour at minute 20
  # Suggested questions are answered ahead of time; see AgentAnswer::SUGGESTED.
  refresh_suggested_answers:
    class: Agent::RefreshSuggestedJob
    schedule: every 2 hours at minute 35
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
