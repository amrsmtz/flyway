# Hand-curated places that no feed provides in the form people name them.
#
# sites:   well-known birding sites. Each is a centre and a radius that
#          gathers the eBird hotspots around it. The centre is the position
#          of the anchor hotspot (an eBird location id), unless latitude and
#          longitude are given for sites too long for a single anchor.
# regions: named areas. Each is either a list of eBird counties of one
#          province, or a bounding box restricted to some provinces, or
#          simply whole provinces. Bounding boxes are approximations.
#
# Import with: bin/rails places:import_curated (after the eBird import).

